<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cycle</title>

    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      body {
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
      }
      .cycle {
        /* border-radius: 100px; */
        border: 3px solid red;
        width: 100%;
        overflow: hidden;
      }
      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
      }
      .cycle img {
        /* width: 100%; */
        position: relative;
        /* animation: moveRight 6.5s linear infinite; */
        animation-name: moveRight;
        animation-duration: 5s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }

      @keyframes moveRight {
        from {
          left: -350px;
        }
        to {
          left: 100%;
        }
      }
      .square {
        width: 150px;
        height: 150px;
        background-color: red;
        animation: colorChange 6s infinite alternate;
        border: 3px solid black;
        border-radius: 10px;
        padding: 12px;
        margin: 12px;
      }
      @keyframes colorChange {
        0% {
          background-color: red;
        }
        33% {
          background-color: blue;
        }
        66% {
          background-color: green;
        }
        100% {
          background-color: orange;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="title">
        <h1>Welcome to Childhood !!</h1>
      </div>
      <div class="cycle">
        <img src="Z:\WT(HTML,CSS)\Lab 5 & 6\cycle.png" alt="cycle is running left to right" />
      </div>
      <div class="square">
        <h2 class="box">Magical SqureBox</h2>
      </div>
    </div>
  </body>
</html>
