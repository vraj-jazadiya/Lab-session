<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Cycle & Animated Square</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 30px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }
    .title h1 {
      margin-bottom: 20px;
    }
    .cycle {
      border: 3px solid red;
      width: 100%;
      overflow: hidden;
      height: 120px; /* fixed height so image fits */
      position: relative;
    }
    .cycle img {
      position: relative;
      animation-name: moveRight;
      animation-duration: 5s;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      height: 100px; /* fix height so it fits */
      left: -150px; /* start off-screen */
    }

    @keyframes moveRight {
      from {
        left: -150px;
      }
      to {
        left: 100%;
      }
    }

    /* Animated square */
    .square {
      width: 150px;
      height: 150px;
      background-color: red;
      animation: colorChange 6s infinite alternate;
      border: 3px solid black;
      border-radius: 10px;
    }

    @keyframes colorChange {
      0% {
        background-color: red;
      }
      33% {
        background-color: blue;
      }
      66% {
        background-color: green;
      }
      100% {
        background-color: orange;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <h1>Welcome to Childhood !!</h1>
    </div>
    <div class="cycle">
      <img src="/cycle.png" alt="cycle is running left to right" />
    </div>
    <div class="square"></div>
  </div>
</body>
</html>
