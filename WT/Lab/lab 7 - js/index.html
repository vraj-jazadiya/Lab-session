<html>
    <head>
        <title>Calcator by Vraj</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>
            Celsius convert the number into Fahrenheit. 
		    <!-- Fahrenheit = User * 1.8 + 32 -->
        </h1>
        <div class="container">
			<label for="Celsius">Enter Celsius value:  </label>	
			<input type="number" id="Celsius" placeholder="Enter Celsius"/>
			<br />
			
			<button onclick="Fahrenheit()">Calcatate Area of triangle</button>
			
			<h3 id="result">Fahrenheit = </h3>
		
        </div>
        <script>
			
		
            function Fahrenheit(){
				const Celsius = Number(document.getElementById('Celsius').value);
			
                
            }
			
			
			
            
        </script>
    </body>
	
</html>
