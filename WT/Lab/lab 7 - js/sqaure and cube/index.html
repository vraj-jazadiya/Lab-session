<html>
    <head>
        <title>Calcator by Vraj</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>
            Simple sum of two number
        </h1>
        <div class="container">
        <label for="num1">Enter the first Number: </label>
        <input type="number" id="num1"/>
		
        </br>
        <label for="num2">Enter the second Number: </label>
        <input type="number" id="num2"/>
        </br>
		
        <button onclick="addSum()">Sum Button</button>
		
		</br>
        <label for="num3">Enter the Square (1-to-till-you-want) Number: </label>
        <input type="number" id="num3"/>
		
        <button onclick="square()">Square Button</button>
		
		</br>
        <label for="num4">Enter the Cube (1-to-till-you-want) Number: </label>
        <input type="number" id="num4"/>
		
        <button onclick="cube()">cube Button</button>
	
        <div id="result">Result = </div>
		
		
        </div>
        <script>
			
			
			function check(num1, num2) {
				if (isNaN(num1) || isNaN(num2)) {
					document.getElementById('result').textContent = "Please enter valid numbers!";
					return false;
				}
				return true;
			}

            function addSum(){
                const num1 = Number(document.getElementById('num1').value);
				const num2 = Number(document.getElementById('num2').value);
			
                if (!check(num1, num2)) return;
				
				const sum = num1+num2;
				document.getElementById('result').textContent = "Sum = " + sum;
            }
			
			function square(){
			
				const num3 = Number(document.getElementById('num3').value);
				
				if (!check(num3,num3)) return;
				
				let text = "";
				
				text += `Squares of numbers from 1 to (${num3}) :\n`;
				for (let i = 1; i<=num3; i++){
					text += `${i}^2 = ${i ** 2}\n`;
				}
				
				
				document.getElementById('result').innerHTML = text.replace(/\n/g,"<br />")
			}
			function cube(){
			
				const num4 = Number(document.getElementById('num4').value);
				
				if (!check(num4,num4)) return;
				
				let text = "";
				
				text += `Squares of numbers from 1 to (${num4}) :\n`;
				for (let i = 1; i<=num4; i++){
					text += `${i}^3 = ${i ** 3}\n`;
				}
				
				
				document.getElementById('result').innerHTML = text.replace(/\n/g,"<br />")
			}
			
            
        </script>
    </body>
	
</html>
