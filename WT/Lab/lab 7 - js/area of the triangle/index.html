<html>
    <head>
        <title>Calcator by Vraj</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>
           Calculation the area of the triangle.
        </h1>
        <div class="container">
			<label for="base">Enter base value:  </label>	
			<input type="number" id="base" placeholder="Base Length"/>
			<br />
			<label for="height">Enter base value:  </label>	
			<input type="number" id="height" placeholder="height Length"/>
			<br />
			
			<button onclick="triangleArea()">Calcatate Area of triangle</button>
			
			<h3 id="result">Area = </h3>
		
        </div>
        <script>
			
		
            function triangleArea(){
                const base = Number(document.getElementById('base').value);
				const height = Number(document.getElementById('height').value);
			
                if ( isNaN(height) || isNaN(base || base<=0 || height <= 0)) {
					document.getElementById('result').textContent = "Please enter valid numbers!";
					return false;
				}
				
				const area = 0.5 * base * height;
				document.getElementById('result').textContent = "Area = " + area;
            }
			
			
			
            
        </script>
    </body>
	
</html>
