<html>
<head>
	<title> calculate square </title>
	
	<style>
	*{
		margin:0px;
		padding:0px;
		font-size:1.3rem;
		font-family:"Courier New";
	}
	
	.container{
		margin:20px;
		padding:20px;
	}
	
	.box{
		margin:20px;
		padding:20px;
	}
	#number{
		margin:20px;
		padding:20px;
	}

	
	.btn {
	  background-color: lightgray;
	  padding: 10px 20px;
	  border: none;
	}

	.btn:hover {
	  background-color: black; 
	  color: white; 
	}
	
	#result{
		background-color: pink; 
		margin-top: 10px;
		padding:12px;
	}
	
	h1{
		text-align:center;
		font-size:1.4rem;
	}
	
	
	
	</style>
</head>
<body>
	<div class="container">

	<h1>Calculate Square of an Entered Number.</h1>
	<div class="box">
	
		<label for="number"> Enter Number for Sqaure</label>
		<input type="number" id="number" placeholder="Enter number">
		<!-- </br> -->
		<button class="btn" onclick="calSquare()">Square</button>
		<div id="result">Result</div>
		
	</div>
	</div>
	<script>
	
	function calSquare(){
		const num = document.getElementById("number").value;
		const result = document.getElementById("result");
		
		if (num==0){
			result.innerHTML = "Not possible brother... ";
		}else{
			const Sqaure = Number(num) * Number(num)	
			result.innerHTML = "Result: " + Sqaure;
		}
		
	}
	
	</script>
       
</body>
</html>
